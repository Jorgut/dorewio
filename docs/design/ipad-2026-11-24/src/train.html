<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.section{margin-top:30px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:14px}
.feature{background:#fff;border:1px solid var(--hair);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;min-height:176px}
.feature .top{display:flex;align-items:center;gap:12px}
.feature .title{font-size:18px;font-weight:650}
.feature .desc{font-size:14px;color:var(--sub);line-height:1.4}
.feature .foot{margin-top:auto;display:flex;justify-content:flex-end;color:#AEAEB2;font-size:20px}
.pro{font-size:11px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:999px}
.note{margin-top:28px;background:linear-gradient(135deg,#fff,rgba(199,41,31,.05));border:1px solid rgba(199,41,31,.12);border-radius:16px;padding:22px;display:flex;gap:16px;align-items:center}
</style></head><body>
<div class="status"><div>09:41</div><div class="right">▮▮▮ ⌁ ▰</div></div>

  </div>
